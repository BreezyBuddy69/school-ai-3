# LG KI 2.0 — Deployment auf dem Hostinger-VPS (halovisionai.cloud).
# Route: https://halovisionai.cloud/lgai (PathPrefix, basePath wird im Build gesetzt).
# Host-Port 47821 bewusst exotisch — kollidiert mit keiner anderen Site auf dem VPS.
# Direktzugriff ohne Traefik: http://<VPS-IP>:47821/lgai

services:
  lgki:
    build:
      context: .
      args:
        # MUSS beim Build gesetzt sein, sonst laufen Assets/API-Calls ohne /lgai ins Leere.
        NEXT_PUBLIC_BASE_PATH: /lgai
    container_name: lgki
    restart: unless-stopped
    networks:
      - traefik-proxy
    ports:
      - "47821:8100"
    env_file:
      # Ohne .env startet die App im Demo-Modus (Mock-KI, Demo-Codes) —
      # `docker compose up` auf nackter Maschine bleibt vorführbar.
      - path: .env
        required: false
    environment:
      - DATA_DIR=/data
      - NEXT_PUBLIC_BASE_PATH=/lgai
    volumes:
      # Nutzer, Tiers, Codes, Chats — dieses Volume ist heilig.
      - lgki_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8100/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      # ── PathPrefix: halovisionai.cloud/lgai (Next serviert selbst unter /lgai — kein StripPrefix!) ──
      - traefik.http.routers.lgki.rule=Host(`halovisionai.cloud`) && PathPrefix(`/lgai`)
      - traefik.http.routers.lgki.entrypoints=websecure
      - traefik.http.routers.lgki.tls.certresolver=letsencrypt
      - traefik.http.services.lgki.loadbalancer.server.port=8100
      # ── Alternative: Subdomain lgki.halovisionai.cloud (dann Build-Arg NEXT_PUBLIC_BASE_PATH leer!) ──
      # - traefik.http.routers.lgki.rule=Host(`lgki.halovisionai.cloud`)

networks:
  traefik-proxy:
    external: true

volumes:
  lgki_data:
