# LG KI 2.0 — Deployment auf dem Hostinger-VPS (halovisionai.cloud).
# Route: https://lgki.halovisionai.cloud (Subdomain, kein basePath nötig).
# Image kommt aus der GitHub Action (ghcr.io) — der VPS baut NICHT selbst,
# genau wie halo4 und hydron-one. Update = `docker compose pull && up -d`.

services:
  lgki:
    image: ghcr.io/breezybuddy69/school-ai-3:master
    container_name: lgki
    restart: unless-stopped
    networks:
      - traefik-proxy
    env_file:
      # ACHTUNG: Im Hostinger-Panel gibt es KEINE .env neben dieser Datei —
      # `required: false` heißt, dass sie dann still fehlt und die App im
      # Demo-Modus startet. Genau daran hing das Deployment fest. Was
      # produktiv gelten soll, gehört unten unter `environment:`.
      - path: .env
        required: false
    environment:
      - DATA_DIR=/data
      # EINE Variable schaltet den Produktivbetrieb scharf (siehe src/lib/n8n.ts):
      #   - N8N_SECRET=<der Wert aus der lokalen .env>
      # Sie steht hier bewusst NICHT — dieses Repo ist öffentlich. Der Wert
      # wird direkt im Panel-YAML eingetragen. Optional daneben:
      #   - ADMIN_TOKEN=<wert>   (nur für /admin)
      # N8N_BASE braucht es nicht mehr: Default steht im Code.
    volumes:
      # Nutzer, Tiers, Codes, Chats — dieses Volume ist heilig.
      - lgki_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8100/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.lgki.rule=Host(`lgki.halovisionai.cloud`)"
      - "traefik.http.routers.lgki.entrypoints=websecure"
      - "traefik.http.routers.lgki.tls=true"
      - "traefik.http.routers.lgki.tls.certresolver=letsencrypt"
      - "traefik.http.services.lgki.loadbalancer.server.port=8100"

networks:
  traefik-proxy:
    external: true

volumes:
  lgki_data:
    # Fester Volume-Name statt "<projektname>_lgki_data". Damit findet der
    # Container die Datenbank wieder, egal unter welchem Projektnamen der
    # Stack neu angelegt wird — Website löschen und neu hochziehen kostet
    # keine Nutzer, Codes oder Chats.
    name: lgki_data
