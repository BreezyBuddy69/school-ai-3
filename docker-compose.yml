# LG KI 2.0 — Deployment auf dem Hostinger-VPS (halovisionai.cloud).
# Route: https://gymi.halovisionai.cloud (Subdomain, kein basePath nötig).
# Host-Port 47821 bewusst exotisch — kollidiert mit keiner anderen Site auf dem VPS.
# Direktzugriff ohne Traefik: http://<VPS-IP>:47821

services:
  lgki:
    build:
      context: .
    container_name: lgki
    restart: unless-stopped
    networks:
      - traefik-proxy
    ports:
      - "47821:8100"
    env_file:
      # Ohne .env startet die App im Demo-Modus (Mock-KI, Demo-Codes) —
      # `docker compose up` auf nackter Maschine bleibt vorführbar.
      - path: .env
        required: false
    environment:
      - DATA_DIR=/data
    volumes:
      # Nutzer, Tiers, Codes, Chats — dieses Volume ist heilig.
      - lgki_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8100/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.lgki.rule=Host(`gymi.halovisionai.cloud`)
      - traefik.http.routers.lgki.entrypoints=websecure
      - traefik.http.routers.lgki.tls.certresolver=letsencrypt
      - traefik.http.services.lgki.loadbalancer.server.port=8100

networks:
  traefik-proxy:
    external: true

volumes:
  lgki_data:
